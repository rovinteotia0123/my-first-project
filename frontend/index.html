<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Cloud Cost Intelligence Dashboard
    </title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body {

            margin: 0;
            padding: 0;

            font-family: Arial, sans-serif;

            background: #020617;

            color: white;
        }

        .container {

            padding: 20px;
        }

        #dashboard {

            display: none;
        }

        #loginBox {

            height: 100vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;
        }

        input {

            width: 250px;

            padding: 12px;

            border: none;

            border-radius: 8px;

            margin-top: 10px;

            outline: none;
        }

        button {

            padding: 12px 20px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            margin-top: 15px;

            background: #2563eb;

            color: white;

            font-weight: bold;
        }

        .cards {

            display: flex;

            gap: 20px;

            margin-top: 30px;
        }

        .card {

            flex: 1;

            background: #1e293b;

            border-radius: 12px;

            padding: 20px;

            text-align: center;
        }

        table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 30px;
        }

        th, td {

            border: 1px solid #334155;

            padding: 12px;

            text-align: center;
        }

        th {

            background: #1e293b;
        }

        canvas {

            background: #0f172a;

            border-radius: 16px;

            padding: 20px;

            margin-top: 30px;

            height: 420px !important;
        }

    </style>

</head>

<body>



<!-- LOGIN PAGE -->

<div id="loginBox">

    <h1>
        Cloud Cost Intelligence Dashboard
    </h1>

    <p style="color:gray;">
        AI Based Cloud Cost Prediction System
    </p>

    <input
        type="text"
        id="username"
        placeholder="Username"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button onclick="login()">
        Login
    </button>

</div>



<!-- DASHBOARD -->

<div id="dashboard" class="container">

    <div
        style="
            display:flex;
            justify-content:space-between;
            align-items:center;
        "
    >

        <h1>
            Cloud Cost Intelligence Dashboard
        </h1>

        <button
            onclick="logout()"
            style="background:red;"
        >
            Logout
        </button>

    </div>


    <p style="color:#94a3b8;">
        Monitor and Predict Cloud Infrastructure Cost
    </p>



    <!-- CARDS -->

    <div class="cards">

        <div class="card">

            <h2>
                Current Cost
            </h2>

            <h1 id="currentCost">
                ₹ 0
            </h1>

        </div>

        <div class="card">

            <h2>
                Predicted Cost
            </h2>

            <h1 id="predictedCost">
                ₹ 0
            </h1>

        </div>

        <div class="card">

            <h2>
                Recommendation
            </h2>

            <p id="recommendation">
                --
            </p>

        </div>

    </div>



    <!-- INPUT -->

    <div style="margin-top:30px;">

        <input
            type="number"
            id="usageInput"
            placeholder="Enter Usage Cost"
        >

        <button onclick="predictCost()">
            Predict
        </button>

    </div>



    <!-- CHART -->

    <canvas id="costChart"></canvas>



    <!-- HISTORY -->

    <h2 style="margin-top:40px;">
        Prediction History
    </h2>

    <table id="historyTable">

        <tr>

            <th>
                Current Cost
            </th>

            <th>
                Predicted Cost
            </th>

            <th>
                Time
            </th>

        </tr>

    </table>

</div>



<script>

console.log("JS RUNNING");


const BASE_URL =
    "http://127.0.0.1:5000";


let chart = null;



// LOGIN

async function login() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    try {

        const response =
            await fetch(
                `${BASE_URL}/login`,
                {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );

        if (!response.ok) {

            alert("Invalid Username or Password");

            return;
        }

        document.getElementById("loginBox")
            .style.display = "none";

        document.getElementById("dashboard")
            .style.display = "block";

        loadDefaultCost();

        loadHistory();

    }

    catch(error) {

        console.log(error);

        alert("Backend Not Running");
    }
}



// LOGOUT

function logout() {

    document.getElementById("dashboard")
        .style.display = "none";

    document.getElementById("loginBox")
        .style.display = "flex";
}



// LOAD DEFAULT COST

async function loadDefaultCost() {

    try {

        const response =
            await fetch(`${BASE_URL}/cost`);

        const data =
            await response.json();

        updateUI(data);

        drawChart(
            data.current_cost,
            data.predicted_cost
        );

    }

    catch(error) {

        console.log(error);
    }
}



// PREDICT

async function predictCost() {

    const usage =
        document.getElementById("usageInput").value;

    if (
        usage === ""
        || usage <= 0
    ) {

        alert("Enter Valid Cost");

        return;
    }

    try {

        const response =
            await fetch(
                `${BASE_URL}/predict/${usage}`
            );

        const data =
            await response.json();

        updateUI(data);

        drawChart(
            data.current_cost,
            data.predicted_cost
        );

        loadHistory();

    }

    catch(error) {

        console.log(error);

        alert("Prediction Failed");
    }
}



// UPDATE UI

function updateUI(data) {

    document.getElementById("currentCost")
        .innerHTML =
        `₹ ${data.current_cost}`;

    document.getElementById("predictedCost")
        .innerHTML =
        `₹ ${data.predicted_cost}`;

    document.getElementById("recommendation")
        .innerHTML =
        data.recommendation;
}



// CHART

function drawChart(current, predicted) {

    const ctx =
        document.getElementById("costChart");

    if (chart) {

        chart.destroy();
    }

    chart = new Chart(ctx, {

        type: "line",

        data: {

            labels: [
                "Jan",
                "Feb",
                "Mar",
                "Apr",
                "May",
                "Jun"
            ],

            datasets: [

                {

                    label: "Current Cost",

                    data: [
                        2000,
                        3200,
                        2800,
                        4500,
                        current,
                        3800
                    ],

                    borderColor: "#3b82f6",

                    backgroundColor: "rgba(59,130,246,0.15)",

                    fill: false,

                    tension: 0.15,

                    borderWidth: 4,

                    pointRadius: 4,

                    pointHoverRadius: 7,

                    pointBackgroundColor: "#3b82f6",

                    pointBorderColor: "#ffffff"
                },

                {

                    label: "Predicted Cost",

                    data: [
                        2500,
                        4000,
                        3500,
                        5000,
                        predicted,
                        4200
                    ],

                    borderColor: "#22c55e",

                    backgroundColor: "rgba(34,197,94,0.12)",

                    fill: false,

                    tension: 0.15,

                    borderWidth: 4,

                    pointRadius: 4,

                    pointHoverRadius: 7,

                    pointBackgroundColor: "#22c55e",

                    pointBorderColor: "#ffffff"
                }
            ]
        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            plugins: {

                legend: {

                    labels: {

                        color: "white",

                        font: {

                            size: 14
                        }
                    }
                }
            },

            scales: {

                x: {

                    ticks: {

                        color: "#cbd5e1",

                        font: {

                            size: 13
                        }
                    },

                    grid: {

                        color: "rgba(255,255,255,0.05)"
                    }
                },

                y: {

                    min: 1500,

                    max: 5500,

                    ticks: {

                        color: "#cbd5e1",

                        font: {

                            size: 13
                        }
                    },

                    grid: {

                        color: "rgba(255,255,255,0.05)"
                    }
                }
            }
        }
    });
}




// HISTORY

async function loadHistory() {

    try {

        const response =
            await fetch(`${BASE_URL}/history`);

        const data =
            await response.json();

        const table =
            document.getElementById("historyTable");

        table.innerHTML = `

            <tr>

                <th>Current Cost</th>

                <th>Predicted Cost</th>

                <th>Time</th>

            </tr>

        `;

        data.forEach(row => {

            table.innerHTML += `

                <tr>

                    <td>₹ ${row[0]}</td>

                    <td>₹ ${row[1]}</td>

                    <td>${row[2]}</td>

                </tr>

            `;
        });

    }

    catch(error) {

        console.log(error);
    }
}

</script>

</body>
</html>
